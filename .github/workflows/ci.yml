name: ci
on: [push, pull_request]

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gym" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gym:gym@localhost:5432/gym
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: service/package-lock.json }

      # 1. database is up (service container) -> 2. apply structure
      - run: psql "$DATABASE_URL" -f service/db/schema.sql
      - run: psql "$DATABASE_URL" -f service/db/seed.sql

      # 3. start the service
      - run: npm ci
        working-directory: service
      - run: node src/app.js > /tmp/service.log 2>&1 &
        working-directory: service

      # 4. wait until it is ready
      - run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:3000/health && exit 0
            sleep 1
          done
          cat /tmp/service.log; exit 1

      # 5. contract check: service vs openapi.yaml
      - run: pip install schemathesis
      - run: bash service/tests/contract/run.sh

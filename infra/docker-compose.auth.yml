# Local Keycloak for Session 4 development. Not the deployed one.
services:
  auth:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}   # from .env, never committed
    ports: ["8080:8080"]

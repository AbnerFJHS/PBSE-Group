# Render Blueprint. Secrets are declared with `sync: false`, so Render asks
# for them in the dashboard and they are never committed (A.10).
services:
  - type: web
    name: gym-api
    runtime: node
    plan: free                 # switch to `starter` before the Session 7 demo (free instances sleep)
    rootDir: service
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health   # must NOT touch the database (A.10 §4)
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL      # Neon connection string, includes ?sslmode=require
        sync: false

